name: Build Cairo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch : x86
      - name: Build Cairo x86
        run: |
          cd cairo-build
          meson setup build-cairo-x86 `
            --prefix=$env:GITHUB_WORKSPACE/prefix-cairo-32
          meson compile -C build-cairo-x86
          meson install -C build-cairo-x86
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cairo-build-x86
          path: prefix-cairo-32/

  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch : x64
      - name: Build Cairo x64
        run: |
          cd cairo-build
          meson setup build-cairo-x64 `
            --prefix=$env:GITHUB_WORKSPACE/prefix-cairo-64
          meson compile -C build-cairo-x64
          meson install -C build-cairo-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cairo-build-x64
          path: prefix-cairo-64/

  build-arm64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch : amd64_arm64
      - name: Build Cairo arm64
        run: |
          cd cairo-build
          meson setup build-cairo-arm64 `
            -Dpixman:a64-neon=disabled `
            -Dpixman:mmx=disabled `
            --prefix=$env:GITHUB_WORKSPACE/prefix-cairo-arm64 `
            --cross-file ../.ci/cross_amd64_arm64.txt
          meson compile -C build-cairo-arm64
          meson install -C build-cairo-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cairo-build-arm64
          path: prefix-cairo-arm64/

  build-pkgconf:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch : x64
      - name: Build pkgconf
        run: |
          cd pkgconf-build
          meson setup build-x64 `
            --prefix=$env:GITHUB_WORKSPACE/prefix-pkgconf
          meson compile -C build-x64
          meson install -C build-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkgconf-build
          path: prefix-pkgconf/


  release:
    permissions:
      contents: write
    runs-on: windows-2022
    needs: [build-x86, build-x64, build-arm64, build-pkgconf]
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cairo-build-x86
          path: cairo-x86/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cairo-build-x64
          path: cairo-x64/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cairo-build-arm64
          path: cairo-arm64/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkgconf-build
          path: pkgconf/
      - name: Zip it
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          7z a "cairo-$RELEASE_TAG-x86.zip" cairo-x86/*
          7z a "cairo-$RELEASE_TAG-x64.zip" cairo-x64/*
          7z a "cairo-$RELEASE_TAG-arm64.zip" cairo-arm64/*
          7z a pkgconf.zip pkgconf/

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "cairo-$RELEASE_TAG-x86.zip" \
            "cairo-$RELEASE_TAG-x64.zip" \
            "cairo-$RELEASE_TAG-arm64.zip" \
            pkgconf.zip
